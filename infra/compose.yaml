services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - sastdast-pgdata:/var/lib/postgresql/data
    # Loopback only, for the host-run CLI (D-14). Never bind 0.0.0.0.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - sastdast-net
      # Docker does not publish ports for containers only on internal networks.
      - sastdast-hostport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  cli:
    build:
      context: ..
      dockerfile: cli/Dockerfile
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sastdast-net

networks:
  sastdast-net:
    name: sastdast-net
    internal: true
  sastdast-hostport:
    name: sastdast-hostport

volumes:
  sastdast-pgdata:
    name: sastdast-pgdata
