# Secrets and weak-crypto rules for the own static pass (CWE-798, 327, 330).
#
# Anchored on general JDK APIs only. Nothing here names a class, method or module
# of a test app: a target that hides a weakness behind its own wrapper is missed
# on purpose, and that miss is recorded as a measured baseline, not fitted away.
#
# Findings from this pass are Code-only by nature: they have no HTTP route and are
# never labelled no_http_path.

weak_hash:
  cwe: 327
  type: Cryptographic Failures
  severity: medium
  # MessageDigest.getInstance("MD5"), etc. The algorithm is the first argument.
  receiver_types: [MessageDigest]
  methods: [getInstance]
  arg: 0
  weak_values: [MD2, MD4, MD5, SHA-0, SHA0, SHA-1, SHA1]

weak_cipher:
  cwe: 327
  type: Cryptographic Failures
  severity: medium
  # Cipher.getInstance("DES"), "AES/ECB/..." etc. The transformation is arg 0.
  receiver_types: [Cipher]
  methods: [getInstance]
  arg: 0
  weak_prefixes: [DES, DESede, RC2, RC4, ARCFOUR, Blowfish]
  weak_modes: [ECB]

weak_random:
  cwe: 330
  type: Weak Random Number Generation
  severity: low
  # new java.util.Random() and Math.random(): not cryptographically strong.
  constructors: [Random]
  static_calls:
    - {receiver: Math, method: random}

hardcoded_secret:
  cwe: 798
  type: Hard-coded Credentials
  severity: high
  # A non-empty string literal assigned to a secret-named field or local.
  name_pattern: "(?i)^(.*_)?(password|passwd|pwd|secret|api_?key|access_?key|private_?key|token|credential)s?$"
  min_length: 1
